<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard — ParkKaro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fafbfd; color: #1e2025; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="/" class="inline-flex items-center gap-2 bg-[#FFCA20] text-[#111827] px-3.5 py-1.5 rounded-full font-black text-base shadow-sm">
          <span>parkkaro</span>
        </a>
        <span class="px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-black uppercase">
          User Dashboard
        </span>
      </div>
      <div class="flex items-center gap-2 text-xs font-bold">
        <a id="devShortcut" href="/dev-dashboard" class="hidden px-3 py-1.5 rounded-xl bg-[#1C4178] text-white">Dev Panel</a>
        <a href="/" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700">Live Map</a>
        <button onclick="handleLogout()" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
    <section class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <p class="text-[11px] font-black uppercase tracking-wider text-[#1C4178]">Signed in account</p>
        <h1 id="userGreeting" class="text-2xl font-black text-slate-900 mt-0.5">Loading account...</h1>
        <p id="userEmailMeta" class="text-xs text-slate-500 mt-1"></p>
      </div>
      <a href="/" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-2xl bg-[#FFCA20] hover:bg-[#F2BC10] text-[#111827] font-black text-xs shadow-sm">
        Find &amp; Book Parking
      </a>
    </section>

    <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <p class="text-[10px] font-bold uppercase text-slate-500">Total Bookings</p>
        <p id="statTotal" class="text-2xl font-black text-[#1C4178] mt-1 font-mono">-</p>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <p class="text-[10px] font-bold uppercase text-slate-500">Active Sessions</p>
        <p id="statActive" class="text-2xl font-black text-emerald-600 mt-1 font-mono">-</p>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <p class="text-[10px] font-bold uppercase text-slate-500">Past Sessions</p>
        <p id="statPast" class="text-2xl font-black text-slate-700 mt-1 font-mono">-</p>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <p class="text-[10px] font-bold uppercase text-slate-500">Total Parking Fees</p>
        <p id="statSpent" class="text-2xl font-black text-slate-900 mt-1 font-mono">-</p>
      </div>
    </section>

    <section class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-black text-slate-900">Your Parking Bookings</h2>
        <button onclick="loadDashboard()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">Refresh</button>
      </div>
      <div id="bookingsList" class="space-y-3">
        <p class="text-xs text-slate-500">Loading your bookings...</p>
      </div>
    </section>
  </main>

  <script>
    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]));
    }

    async function loadDashboard() {
      const res = await fetch('/api/user/dashboard', { credentials: 'include' });
      if (res.status === 401) {
        window.location.href = '/login';
        return;
      }
      if (!res.ok) return;
      const data = await res.json();

      const u = data.user;
      document.getElementById('userGreeting').innerText = u.full_name || u.email;
      document.getElementById('userEmailMeta').innerText = `${u.email} • Role: ${u.role}`;
      if (u.role === 'developer') {
        document.getElementById('devShortcut').classList.remove('hidden');
      }

      document.getElementById('statTotal').innerText = data.summary.total_bookings;
      document.getElementById('statActive').innerText = data.summary.active_bookings;
      document.getElementById('statPast').innerText = data.summary.completed_or_past;
      document.getElementById('statSpent').innerText = `₹${data.summary.total_spent}`;

      const list = document.getElementById('bookingsList');
      if (!data.bookings || data.bookings.length === 0) {
        list.innerHTML = `<div class="p-6 text-center rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-500">No personal bookings yet. Open the Live Map while signed in to reserve a spot.</div>`;
        return;
      }

      list.innerHTML = data.bookings.map(b => `
        <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <div class="flex items-center gap-2 text-xs">
              <span class="font-black text-[#1C4178] uppercase">${escapeHtml(b.city || '')}</span>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-black ${b.status === 'active' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">${escapeHtml(b.status)}</span>
              <span class="font-mono text-slate-500">${escapeHtml(b.vehicle_type.toUpperCase())}</span>
            </div>
            <p class="font-black text-sm text-slate-900 mt-1">${escapeHtml(b.spot_name || 'Parking Spot')}</p>
            <p class="text-[11px] text-slate-500 font-mono mt-0.5">Plate/Name: ${escapeHtml(b.user_name)} • Ends: ${new Date(b.end_time).toLocaleString()}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-mono font-black text-sm text-slate-900">${b.total_cost > 0 ? '₹' + b.total_cost : 'FREE'}</span>
            ${b.status === 'active' ? `<button onclick="endBooking(${b.id})" class="px-3 py-1.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold">End Park</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    async function endBooking(id) {
      const res = await fetch(`/api/user/bookings/${id}/end`, { method: 'POST', credentials: 'include' });
      if (res.ok) loadDashboard();
    }

    async function handleLogout() {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login';
    }

    window.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
