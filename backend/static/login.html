<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — ParkKaro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fafbfd; color: #1e2025; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b border-slate-200 bg-white/95 backdrop-blur-md">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/home" class="inline-flex items-center gap-2 bg-[#FFCA20] text-[#111827] px-3.5 py-1.5 rounded-full font-black text-base shadow-sm">
        <span>parkkaro</span>
      </a>
      <div class="flex items-center gap-2 text-xs font-bold">
        <a href="/" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors">Live Map</a>
        <a href="/home" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors">Home</a>
      </div>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
      <div class="bg-[#1C4178] px-6 py-5 text-white">
        <span class="inline-block px-2.5 py-0.5 rounded-full bg-[#FFCA20] text-[#111827] text-[10px] font-black uppercase tracking-wider mb-2">
          Secure Access
        </span>
        <h1 class="text-xl font-black">Welcome to ParkKaro</h1>
        <p class="text-xs text-blue-100 mt-1">Sign in to access your dashboard. Role permissions are enforced server-side.</p>
      </div>

      <div class="p-6">
        <!-- Mode Toggle -->
        <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-2xl mb-5">
          <button id="tabLogin" type="button" onclick="setMode('login')" class="py-2 rounded-xl text-xs font-black bg-white text-[#111827] shadow-sm">
            Sign In
          </button>
          <button id="tabSignup" type="button" onclick="setMode('signup')" class="py-2 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800">
            Create Account
          </button>
        </div>

        <div id="authError" class="hidden mb-4 p-3 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold"></div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
          <div id="nameGroup" class="hidden">
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
            <input id="fullNameInput" type="text" maxlength="120" placeholder="Rahul Sharma" class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:border-[#1C4178] focus:ring-2 focus:ring-[#FFCA20]" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
            <input id="emailInput" type="email" required autocomplete="email" placeholder="you@example.com" class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:border-[#1C4178] focus:ring-2 focus:ring-[#FFCA20]" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
            <input id="passwordInput" type="password" required autocomplete="current-password" minlength="8" placeholder="Minimum 8 chars (letters + numbers)" class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:border-[#1C4178] focus:ring-2 focus:ring-[#FFCA20]" />
          </div>

          <button id="submitBtn" type="submit" class="w-full py-3 rounded-2xl bg-[#FFCA20] hover:bg-[#F2BC10] text-[#111827] font-black text-sm shadow-md transition-all">
            Sign In
          </button>
        </form>
      </div>
    </div>
  </main>

  <script>
    let authMode = 'login';

    function redirectByRole(role) {
      window.location.href = role === 'developer' ? '/dev-dashboard' : '/dashboard';
    }

    function setMode(mode) {
      authMode = mode;
      const isSignup = mode === 'signup';
      document.getElementById('nameGroup').classList.toggle('hidden', !isSignup);
      document.getElementById('submitBtn').innerText = isSignup ? 'Create User Account' : 'Sign In';
      document.getElementById('passwordInput').autocomplete = isSignup ? 'new-password' : 'current-password';
      document.getElementById('tabLogin').className = !isSignup
        ? 'py-2 rounded-xl text-xs font-black bg-white text-[#111827] shadow-sm'
        : 'py-2 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800';
      document.getElementById('tabSignup').className = isSignup
        ? 'py-2 rounded-xl text-xs font-black bg-white text-[#111827] shadow-sm'
        : 'py-2 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800';
      document.getElementById('authError').classList.add('hidden');
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const errBox = document.getElementById('authError');
      const btn = document.getElementById('submitBtn');
      errBox.classList.add('hidden');
      btn.disabled = true;

      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const fullName = document.getElementById('fullNameInput').value.trim();

      const endpoint = authMode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
      const payload = authMode === 'signup'
        ? { email, password, full_name: fullName || null }
        : { email, password };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.detail || 'Authentication failed');
        }
        redirectByRole(data.role);
      } catch (err) {
        errBox.innerText = err.message || 'Authentication failed';
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const me = await res.json();
          redirectByRole(me.role);
        }
      } catch (_) {}
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
